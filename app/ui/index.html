<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knddle</title>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/ambient.css" />
    <link rel="stylesheet" href="./styles/glass.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <div class="ambient" id="ambient" aria-hidden="true">
      <div class="blob blob--abyss"></div>
      <div class="blob blob--royal"></div>
      <div class="blob blob--cyan"></div>
      <div class="swirl swirl--outer"></div>
      <div class="swirl swirl--inner"></div>
      <div class="pointer-glow" id="pointer-glow"></div>
      <div class="grain"></div>
    </div>

    <div class="droplets" aria-hidden="true">
      <div class="droplet-anchor droplet-anchor--a" data-droplet="0.9"><div class="droplet"></div></div>
      <div class="droplet-anchor droplet-anchor--b" data-droplet="0.55"><div class="droplet"></div></div>
      <div class="droplet-anchor droplet-anchor--c" data-droplet="1.2"><div class="droplet"></div></div>
      <div class="droplet-anchor droplet-anchor--d" data-droplet="0.4"><div class="droplet"></div></div>
    </div>

    <div class="titlebar" data-tauri-drag-region></div>

    <main class="stage">
      <section class="hero-shell" id="hero">
        <div class="glass panel squircle" data-glass="panel">
          <div class="hero">
            <svg class="device" data-depth="14" viewBox="0 0 104 142" aria-hidden="true">
              <defs>
                <linearGradient id="device-body" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#1b3f9e" />
                  <stop offset="1" stop-color="#061542" />
                </linearGradient>
                <linearGradient id="device-screen" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#f6fbff" />
                  <stop offset="1" stop-color="#dcecf8" />
                </linearGradient>
                <linearGradient id="device-gloss" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#fff" stop-opacity="0.35" />
                  <stop offset="0.45" stop-color="#fff" stop-opacity="0" />
                </linearGradient>
              </defs>
              <rect x="1" y="1" width="102" height="140" rx="15" fill="url(#device-body)" stroke="rgb(169 236 255 / 0.45)" stroke-width="1.2" />
              <rect x="10" y="12" width="84" height="110" rx="3.5" fill="url(#device-screen)" />
              <g fill="#9fb4cf">
                <rect x="19" y="26" width="40" height="5" rx="2.5" fill="#5a7397" />
                <rect x="19" y="40" width="66" height="3" rx="1.5" />
                <rect x="19" y="48" width="62" height="3" rx="1.5" />
                <rect x="19" y="56" width="66" height="3" rx="1.5" />
                <rect x="19" y="64" width="52" height="3" rx="1.5" />
                <rect x="19" y="76" width="66" height="3" rx="1.5" />
                <rect x="19" y="84" width="60" height="3" rx="1.5" />
                <rect x="19" y="92" width="66" height="3" rx="1.5" />
                <rect x="19" y="100" width="36" height="3" rx="1.5" />
              </g>
              <rect x="46" y="130" width="12" height="3" rx="1.5" fill="rgb(169 236 255 / 0.5)" />
              <rect x="1" y="1" width="102" height="140" rx="15" fill="url(#device-gloss)" />
            </svg>

            <p class="eyebrow" data-depth="6">Knddle</p>
            <h1 data-depth="5">Suelta un libro</h1>
            <p data-depth="4">Arrastra un archivo aquí o pega un enlace. Llegará a tu Kindle como un libro comprado.</p>

            <div class="formats" data-depth="3" aria-label="Formatos compatibles">
              <span class="chip pill" data-glass="pill">PDF</span>
              <span class="chip pill" data-glass="pill">EPUB</span>
              <span class="chip pill" data-glass="pill">DOCX</span>
              <span class="chip pill" data-glass="pill">MOBI</span>
              <span class="chip pill" data-glass="pill">HTML</span>
              <span class="chip pill" data-glass="pill">Web</span>
            </div>

            <div class="actions" id="actions">
              <span class="lens" id="lens" aria-hidden="true"></span>
              <button class="button pill pill--primary squircle" data-glass="pill" id="insert" type="button">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
                <span>Insertar</span>
              </button>
              <button class="button pill squircle" data-glass="pill" id="link" type="button">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6.5 9.5l3-3M7 4.5l1-1a2.83 2.83 0 014 4l-1 1M9 11.5l-1 1a2.83 2.83 0 01-4-4l1-1" /></svg>
                <span>Enlace</span>
              </button>

              <form class="link-field pill squircle" data-glass="pill" id="link-field" novalidate>
                <input id="link-input" type="url" inputmode="url" placeholder="https://" aria-label="Enlace del libro" autocomplete="off" spellcheck="false" />
                <button class="icon-button" type="submit" aria-label="Continuar">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" /></svg>
                </button>
              </form>
            </div>
          </div>
        </div>
      </section>

      <article class="card-shell" id="card" aria-live="polite">
        <div class="glass card squircle" data-glass="panel">
          <div class="card__head">
            <div class="card__cover" id="card-cover"></div>
            <div class="card__meta">
              <div class="card__title" id="card-title"></div>
              <div class="card__subtitle" id="card-subtitle"></div>
            </div>
            <button class="icon-button card__close" id="card-close" type="button" aria-label="Quitar">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></svg>
            </button>
          </div>
          <p class="phases__caption">Así se convertirá</p>
          <ol class="phases" id="phases"></ol>
        </div>
      </article>
    </main>

    <div class="drop glass squircle" id="drop" aria-hidden="true">
      <div>
        <div class="drop__ring" id="drop-ring">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 6v16M9 15l7 7 7-7M7 26h18" /></svg>
        </div>
        <p class="drop__label">Suelta para convertir</p>
      </div>
    </div>
  </body>
</html>
