<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knddle</title>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <div class="titlebar" data-tauri-drag-region></div>

    <main class="stage">
      <section class="hero" id="hero">
        <svg class="device" viewBox="0 0 112 152" aria-hidden="true">
          <rect x="1" y="1" width="110" height="150" rx="14" fill="var(--surface-solid)" stroke="var(--stroke-strong)" stroke-width="1.5" />
          <rect x="11" y="13" width="90" height="118" rx="3" fill="var(--grey-100)" />
          <g fill="var(--grey-300)">
            <rect x="21" y="29" width="46" height="5" rx="2.5" fill="var(--grey-400)" />
            <rect x="21" y="44" width="70" height="3" rx="1.5" />
            <rect x="21" y="52" width="66" height="3" rx="1.5" />
            <rect x="21" y="60" width="70" height="3" rx="1.5" />
            <rect x="21" y="68" width="58" height="3" rx="1.5" />
            <rect x="21" y="80" width="70" height="3" rx="1.5" />
            <rect x="21" y="88" width="64" height="3" rx="1.5" />
            <rect x="21" y="96" width="70" height="3" rx="1.5" />
            <rect x="21" y="104" width="40" height="3" rx="1.5" />
          </g>
          <rect x="50" y="139" width="12" height="3" rx="1.5" fill="var(--grey-300)" />
        </svg>

        <h1>Suelta un libro</h1>
        <p>PDF, EPUB, DOCX y más, o pega un enlace.</p>

        <div class="actions" id="actions">
          <button class="button button--primary squircle" id="insert" type="button">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
            Insertar
          </button>
          <button class="button button--secondary squircle" id="link" type="button">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6.5 9.5l3-3M7 4.5l1-1a2.83 2.83 0 014 4l-1 1M9 11.5l-1 1a2.83 2.83 0 01-4-4l1-1" /></svg>
            Enlace
          </button>

          <form class="link-field" id="link-field" novalidate>
            <input id="link-input" type="url" inputmode="url" placeholder="https://" aria-label="Enlace del libro" autocomplete="off" spellcheck="false" />
            <button class="icon-button" type="submit" aria-label="Continuar">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" /></svg>
            </button>
          </form>
        </div>
      </section>

      <article class="card squircle" id="card" aria-live="polite">
        <div class="card__head">
          <div class="card__cover" id="card-cover"></div>
          <div class="card__meta">
            <div class="card__title" id="card-title"></div>
            <div class="card__subtitle" id="card-subtitle"></div>
          </div>
          <button class="icon-button card__close" id="card-close" type="button" aria-label="Quitar">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></svg>
          </button>
        </div>
        <p class="phases__caption">Así se convertirá</p>
        <ol class="phases" id="phases"></ol>
      </article>
    </main>

    <div class="drop squircle" id="drop" aria-hidden="true">
      <div>
        <div class="drop__ring" id="drop-ring">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 6v16M9 15l7 7 7-7M7 26h18" /></svg>
        </div>
        <p class="drop__label">Suelta para convertir</p>
      </div>
    </div>
  </body>
</html>
