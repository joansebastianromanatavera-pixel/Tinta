<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Knddle</title>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/ambient.css" />
    <link rel="stylesheet" href="./styles/glass.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <div class="light light--key"></div>
      <div class="light light--fill"></div>
      <div class="grain" id="grain"></div>
    </div>

    <div class="titlebar" data-tauri-drag-region></div>

    <main class="stage">
      <section class="hero-shell" id="hero">
        <div class="glass panel squircle" data-glass="panel">
          <div class="hero">
            <svg class="device" viewBox="0 0 64 88" fill="none" aria-hidden="true">
              <rect x="1" y="1" width="62" height="86" rx="10" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.5" />
              <rect x="7" y="8" width="50" height="66" rx="2.5" fill="currentColor" fill-opacity="0.06" />
              <g fill="currentColor" fill-opacity="0.32">
                <rect x="13" y="16" width="22" height="3" rx="1.5" fill-opacity="0.55" />
                <rect x="13" y="25" width="38" height="2" rx="1" />
                <rect x="13" y="30" width="35" height="2" rx="1" />
                <rect x="13" y="35" width="38" height="2" rx="1" />
                <rect x="13" y="40" width="28" height="2" rx="1" />
                <rect x="13" y="48" width="38" height="2" rx="1" />
                <rect x="13" y="53" width="33" height="2" rx="1" />
                <rect x="13" y="58" width="20" height="2" rx="1" />
              </g>
              <rect x="28" y="79" width="8" height="2" rx="1" fill="currentColor" fill-opacity="0.4" />
            </svg>
            <h1>Suelta un libro</h1>
            <p>Arrastra un archivo o pega un enlace.</p>

            <div class="actions" id="actions">
              <button class="button pill pill--primary squircle" data-glass="pill" id="insert" type="button">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10" /></svg>
                <span>Insertar</span>
              </button>
              <button class="button pill squircle" data-glass="pill" id="link" type="button">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6.5 9.5l3-3M7 4.5l1-1a2.83 2.83 0 014 4l-1 1M9 11.5l-1 1a2.83 2.83 0 01-4-4l1-1" /></svg>
                <span>Enlace</span>
              </button>

              <form class="link-field pill squircle" data-glass="pill" id="link-field" novalidate>
                <input id="link-input" type="url" inputmode="url" placeholder="https://" aria-label="Enlace del libro" autocomplete="off" spellcheck="false" />
                <button class="icon-button" type="submit" aria-label="Continuar">
                  <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" /></svg>
                </button>
              </form>
            </div>
          </div>
        </div>
      </section>

      <article class="card-shell" id="card" aria-live="polite">
        <div class="glass card squircle" data-glass="panel">
          <div class="card__head">
            <div class="card__cover" id="card-cover"></div>
            <div class="card__meta">
              <div class="card__title" id="card-title"></div>
              <div class="card__subtitle" id="card-subtitle"></div>
            </div>
            <button class="icon-button card__close" id="card-close" type="button" aria-label="Quitar">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></svg>
            </button>
          </div>
          <p class="phases__caption">Así se convertirá</p>
          <ol class="phases" id="phases"></ol>
        </div>
      </article>
    </main>

    <div class="drop glass squircle" id="drop" aria-hidden="true">
      <div>
        <div class="drop__ring" id="drop-ring">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 6v16M9 15l7 7 7-7M7 26h18" /></svg>
        </div>
        <p class="drop__label">Suelta para convertir</p>
      </div>
    </div>
  </body>
</html>
