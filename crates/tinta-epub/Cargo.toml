[package]
name = "tinta-epub"
description = "EPUB 3 packager for Tinta: Kindle-ready XHTML, CSS, navigation and metadata"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
tinta-core = { path = "../tinta-core" }
uuid = { version = "1.20.0", default-features = false, features = ["v5"] }
zip = { version = "5.0.1", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
tinta-pdf = { path = "../tinta-pdf" }

