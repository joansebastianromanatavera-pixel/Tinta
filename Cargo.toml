[workspace]
resolver = "2"
members = ["crates/tinta-core", "crates/tinta-kindle", "crates/tinta-pdf", "crates/tinta-epub", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Sebastian Romaña"]
rust-version = "1.82"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
