name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    name: App · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Build interface
        working-directory: app
        run: npm ci && npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  core-distros:
    name: Core · ${{ matrix.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro: ["fedora:latest", "archlinux:latest", "debian:stable"]
    runs-on: ubuntu-24.04
    container: ${{ matrix.distro }}
    steps:
      - name: Toolchain
        run: |
          if command -v dnf; then dnf install -y gcc git curl; fi
          if command -v pacman; then pacman -Syu --noconfirm gcc git curl; fi
          if command -v apt-get; then apt-get update && apt-get install -y gcc git curl ca-certificates; fi
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - uses: actions/checkout@v4
      - run: ~/.cargo/bin/cargo test -p knddle-core -p knddle-kindle
